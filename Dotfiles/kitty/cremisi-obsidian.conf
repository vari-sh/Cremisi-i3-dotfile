# Cremisi Obsidian - kitty color scheme (materioteca gotica)
# Uso: metti questo file in ~/.config/kitty/ e aggiungi in kitty.conf:
#   include cremisi-obsidian.conf
# poi ricarica (Ctrl+Shift+F5) o riavvia kitty.

# superfici
foreground            #e9e1d1
background            #171a1c
selection_foreground  #f3eee6
selection_background  #3b2328

# cursore
cursor                #e2586a
cursor_text_color     #171a1c

# link
url_color             #6886bb

# bordi finestre e split
active_border_color   #c42740
inactive_border_color #2b2b2e
bell_border_color     #cf9142

# barra dei tab
active_tab_foreground   #f3eee6
active_tab_background   #c42740
inactive_tab_foreground #9a948c
inactive_tab_background #1f2224
tab_bar_background      #121416

# 16 colori ANSI (allineati ai materiali)
# black
color0  #2b2b2e
color8  #4a4e50
# red - blood
color1  #e2586a
color9  #ef6f80
# green - malachite
color2  #44a078
color10 #5bb48d
# yellow - amber / tallow
color3  #dccb9a
color11 #cf9142
# blue - lapis
color4  #6886bb
color12 #6886bb
# magenta - amethyst / wine
color5  #9c7bb0
color13 #b27a90
# cyan - lapis
color6  #86a3d0
color14 #86a3d0
# white - bone
color7  #e9e1d1
color15 #f3eee6