# vim:ft=kitty

## name:     Cremisi Obsidian
## author:   vari.sh
## blurb:    Gothic and arcane: crypt stone, bone and blood.



# The basic colors
foreground              #e9e1d1
background              #17171c
# Keep the original text colors inside the selection
selection_foreground    none
# crimson at 24% alpha over the crypt stone background
selection_background    #411b25

# Cursor colors (the caret is blood)
cursor                  #e2586a
cursor_text_color       #17171c

# Scrollbar colors
scrollbar_handle_color  #9a948c
scrollbar_track_color   #27272c

# URL color when hovering with mouse
url_color               #6886bb

# Kitty window border colors
active_border_color     #c42740
inactive_border_color   #4a4a50
bell_border_color       #cf9142

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #e9e1d1
active_tab_background   #7e1023
inactive_tab_foreground #9a948c
inactive_tab_background #131317
tab_bar_background      #0f0f13

# Colors for marks (marked text in the terminal)
mark1_foreground #17171c
mark1_background #e2586a
mark2_foreground #17171c
mark2_background #9c7bb0
mark3_foreground #17171c
mark3_background #6886bb

# The 16 terminal colors

# black (stone)
color0 #27272c
color8 #6a666a

# red (blood)
color1 #e2586a
color9 #e2586a

# green (malachite)
color2  #44a078
color10 #44a078

# yellow (tallow / amber)
color3  #dccb9a
color11 #cf9142

# blue (lapis)
color4  #6886bb
color12 #6886bb

# magenta (amethyst / wine)
color5  #9c7bb0
color13 #b27a90

# cyan (verdigris)
color6  #6bb3b0
color14 #6bb3b0

# white (iron / bone)
color7  #9a948c
color15 #e9e1d1

# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMono Nerd Font Mono" style="Light"
bold_font        family="JetBrainsMono Nerd Font Mono" style="SemiBold"
italic_font      family="JetBrainsMono Nerd Font Mono" style="Light Italic"
bold_italic_font family="JetBrainsMono Nerd Font Mono" style="SemiBold Italic"

symbol_map U+1F000-U+1FAFF Noto Color Emoji
# END_KITTY_FONTS

font_size 14.0

# background_opacity 0.8

# TEST
# sync_to_monitor no
# input_delay 0
# repaint_delay 5
# linux_display_server x11
