;==========================================================
;
;   POLYBAR CONFIG - CREMISI OBSIDIAN
;
;==========================================================

[colors]
; Cremisi Obsidian palette
ground = #17171c
ink = #e9e1d1
iron = #9a948c
incense = #9e8d99
crimson = #c42740
crimson_deep = #7e1023
blood = #e2586a
lapis = #6886bb
tallow = #dccb9a
amber = #cf9142
malachite = #44a078
verdigris = #6bb3b0
amethyst = #9c7bb0
wine = #b27a90
petal = #c58f96
sealwax = #c6784c
border = #27272c
gutter_fg = #4a4a50
transparent = #00000000

[bar/main]
width = 98%
# height = 36
height = 29
offset-x = 1%
offset-y = 10
# radius = 16
fixed-center = true
bottom = false

override-redirect = true

background = ${colors.ground}
foreground = ${colors.ink}

line-size = 2
line-color = ${colors.crimson}

border-size = 0
border-color = ${colors.transparent}

padding-left = 1
padding-right = 1

module-margin-left = 1
module-margin-right = 1

# separator = |
# separator-foreground = ${colors.border}

font-0 = "JetBrainsMono Nerd Font:style=Bold:size=10;3"
font-1 = "JetBrainsMono Nerd Font:size=12;3"
font-2 = "JetBrainsMono Nerd Font:size=18;4"

modules-left = rofi point i3  point xwindow
modules-center = point date point
modules-right = pulseaudio point memory point cpu point public-ip point battery point powermenu

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
wm-restack = i3

;==========================================================
; MODULES
;==========================================================

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = false
wrapping-scroll = false
reverse-scroll = false
fuzzy-match = true

; --- FOCUSED WORKSPACE (Active) ---

label-focused = "%{T3}%{F#27272c}%{F-}%{T-}%{B#27272c}%{F#e2586a} %name% %{F-}%{B-}%{T3}%{F#27272c}%{F-}%{T-}"
label-focused-background = ${colors.ground}
label-focused-padding = 0

; --- UNFOCUSED WORKSPACE (Inactive) ---
label-unfocused = %name%
label-unfocused-padding = 1
label-unfocused-foreground = ${colors.iron}

; --- URGENT WORKSPACE (Alert) ---
label-urgent = "%{T3}%{F#cf9142}%{F-}%{T-}%{B#cf9142}%{F#17171c} %name% %{F-}%{B-}%{T3}%{F#cf9142}%{F-}%{T-}"
label-urgent-background = ${colors.ground}
label-urgent-foreground = ${colors.amber}
label-urgent-padding = 0

; --- VISIBLE WORKSPACE ---
label-visible = %name%
label-visible-padding = 1
label-visible-foreground = ${colors.ink}

[module/rofi]
type = custom/text

content = "%{T3}%{F#27272c}%{F-}%{T-}%{B#27272c}%{F#e2586a} 󰣇 %{F-}%{B-}%{T3}%{F#27272c}%{F-}%{T-}"

click-left = rofi -show drun -show-icons

[module/point]
type = custom/text
content = 
content-foreground = ${colors.gutter_fg}
content-font = 1
content-padding = 1
content-margin = 0

[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %d-%m-%Y %H:%M:%S
label = %date%
label-foreground = ${colors.ink}
format-prefix = "  "
format-prefix-foreground = ${colors.verdigris}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
label-volume-foreground = ${colors.ink}
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-foreground = ${colors.lapis}
label-muted = 󰝟 Muted
label-muted-foreground = ${colors.incense}

[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.amber}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.blood}
label = %percentage:2%%

[module/wlan]
type = internal/network
interface-type = wireless
interval = 3.0
format-connected = <label-connected>
format-connected-prefix = "  "
format-connected-prefix-foreground = ${colors.malachite}
label-connected = %essid%

format-disconnected = <label-disconnected>
label-disconnected = "󰤮 "
label-disconnected-foreground = ${colors.blood}

[module/eth]
type = internal/network
interface = ens33
interval = 3.0

format-connected = <label-connected>
format-connected-prefix = "󰈀 "
format-connected-prefix-foreground = ${colors.malachite}
label-connected = %local_ip%

format-disconnected = <label-disconnected>
label-disconnected = "󰈂 "
label-disconnected-foreground = ${colors.blood}

[module/public-ip]
type = custom/script
exec = ~/.config/polybar/scripts/ip_monitor.sh
tail = true

label = %output%
label-foreground = ${colors.ink}

# Left click: copy IP
click-left = kill -USR1 %pid%
# Right click: Info
click-right = kill -USR2 %pid%

[module/battery]
type = internal/battery
battery = BAT1
adapter = ACAD
full-at = 98
low-at = 20

format-full = <ramp-capacity> <label-full>
label-full = %percentage%%
label-full-foreground = ${colors.ink}

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>

label-charging = %percentage%%
label-discharging = %percentage%%

format-low = <animation-low> <label-low>
label-low = %percentage%%
label-low-foreground = ${colors.blood}

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-foreground = ${colors.malachite}

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-foreground = ${colors.petal}
animation-charging-framerate = 750

animation-low-0 = 
animation-low-1 = 󱃍
animation-low-foreground = ${colors.blood}
animation-low-framerate = 750

[module/powermenu]
type = custom/text
label = " " 
label-foreground = ${colors.blood}
click-left = ~/.config/rofi/scripts/powermenu.sh

[module/tray]
type = internal/tray
tray-padding = 2
tray-size = 65%
tray-background = ${colors.ground}

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%
label-maxlen = 60
label-foreground = ${colors.petal}
label-background = ${colors.ground}
label-padding = 0
label-margin = 0
